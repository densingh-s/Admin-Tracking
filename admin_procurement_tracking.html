<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN PROCUREMENT &amp; TRACKING</title>
<!-- Icons: Font Awesome (CDN). If it cannot load, buttons fall back to text labels. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onerror="document.documentElement.classList.add('no-fa')">
<!-- Optional: SheetJS enables Excel (.xlsx) import/export. CSV always works without it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --pri:#2596be; --pri-d:#1b7a9c; --pri-dd:#155f79; --pri-50:#eef7fb; --pri-100:#dcedf4; --pri-200:#b9dbe8;
  --ink:#1a1a1a; --ink2:#4a5157; --ink3:#7b838a; --line:#d5dbe0; --line2:#e7eaed; --bg:#f1f4f6; --white:#fff;
  --danger:#a23a34; --danger-l:#f8dedc; --warn-l:#f9d9d7;
  --r:6px; --side:220px; --hdr:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(rgba(241,244,246,.94),rgba(241,244,246,.94)),url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27120%27%20height%3D%27120%27%3E%3Crect%20width%3D%27120%27%20height%3D%27120%27%20fill%3D%27%23f1f4f6%27/%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23dbe6ea%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M0%2060H120M60%200V120%27/%3E%3C/g%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2760%27%20r%3D%272%27%20fill%3D%27%23c7d7dd%27/%3E%3Ccircle%20cx%3D%270%27%20cy%3D%270%27%20r%3D%272%27%20fill%3D%27%23c7d7dd%27/%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%270%27%20r%3D%272%27%20fill%3D%27%23c7d7dd%27/%3E%3Ccircle%20cx%3D%270%27%20cy%3D%27120%27%20r%3D%272%27%20fill%3D%27%23c7d7dd%27/%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%27120%27%20r%3D%272%27%20fill%3D%27%23c7d7dd%27/%3E%3C/svg%3E") ,var(--bg);background-attachment:fixed}
h1,h2,h3,h4{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-d)}
.hidden{display:none!important}
.mut{color:var(--ink3)}
.no-fa .fa-solid,.no-fa .fa-regular{display:none}
.ib-t{display:none}.no-fa .ib-t{display:inline;font-size:11px}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--pri-50);border-color:var(--pri-200)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri-d)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#8a2f2a}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid transparent;background:transparent;border-radius:4px;cursor:pointer;color:var(--ink2);font-size:12px;padding:0}
.ib:hover:not([disabled]){background:var(--pri-100);color:var(--pri-dd)}
.ib.del:hover:not([disabled]){background:var(--danger-l);color:var(--danger)}
.ib[disabled]{opacity:.35;cursor:not-allowed}
.no-fa .ib{width:auto;padding:0 3px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.field>label{font-size:12px;color:var(--ink2);font-weight:600}
.field .req{color:var(--danger)}
.inp,.sel,.txt{width:100%;height:34px;padding:0 10px;border:1px solid #c5ccd2;border-radius:var(--r);background:#fff;font-size:13px}
.txt{height:auto;padding:8px 10px;min-height:84px;resize:vertical}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--pri);outline:2px solid var(--pri-100)}
.inp[disabled],.sel[disabled],.txt[disabled]{background:#eef0f2;color:#80878d;cursor:not-allowed}
.invalid{border-color:var(--danger)!important}
.err{color:var(--danger);font-size:12px;min-height:0}
.hint{color:var(--ink3);font-size:11.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.cnt{align-self:flex-end;font-size:11px;color:var(--ink3)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0 10px}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,rgba(21,95,121,.94),rgba(37,150,190,.90)),url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27140%27%20height%3D%27140%27%3E%3Crect%20width%3D%27140%27%20height%3D%27140%27%20fill%3D%27%23155f79%27/%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%232596be%27%20stroke-width%3D%271%27%20opacity%3D%270.35%27%3E%3Cpath%20d%3D%27M0%2070H140M70%200V140%27/%3E%3Crect%20x%3D%2710%27%20y%3D%2710%27%20width%3D%27120%27%20height%3D%27120%27/%3E%3C/g%3E%3Ccircle%20cx%3D%2770%27%20cy%3D%2770%27%20r%3D%272.5%27%20fill%3D%27%23eaf6fb%27%20opacity%3D%270.5%27/%3E%3C/svg%3E"),var(--pri-dd)}
.lg-card{display:grid;grid-template-columns:1.05fr 1fr;width:min(880px,100%);background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.lg-brand{padding:34px 30px;color:#fff;background:linear-gradient(160deg,var(--pri-dd),var(--pri)),url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27140%27%20height%3D%27140%27%3E%3Crect%20width%3D%27140%27%20height%3D%27140%27%20fill%3D%27%23155f79%27/%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%232596be%27%20stroke-width%3D%271%27%20opacity%3D%270.35%27%3E%3Cpath%20d%3D%27M0%2070H140M70%200V140%27/%3E%3Crect%20x%3D%2710%27%20y%3D%2710%27%20width%3D%27120%27%20height%3D%27120%27/%3E%3C/g%3E%3Ccircle%20cx%3D%2770%27%20cy%3D%2770%27%20r%3D%272.5%27%20fill%3D%27%23eaf6fb%27%20opacity%3D%270.5%27/%3E%3C/svg%3E");display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.lg-brand h1{font-size:24px;line-height:1.2;letter-spacing:.2px}
.lg-brand p{margin:10px 0 0;color:#e2f2f8;font-size:13.5px}
.lg-brand ul{margin:0;padding:0;list-style:none;font-size:13px;color:#e2f2f8}
.lg-brand li{display:flex;gap:9px;margin:7px 0;align-items:center}
.lg-form{padding:34px 32px}
.lg-form h2{font-size:19px;margin-bottom:4px}
.lg-form .sub{color:var(--ink2);font-size:13px;margin-bottom:18px}
.lg-links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.lg-links a{cursor:pointer}
.demo-box{margin-top:16px;border:1px dashed var(--pri-200);background:var(--pri-50);border-radius:var(--r);padding:9px 11px;font-size:12px;color:var(--ink2)}
.demo-box b{color:var(--ink)}
.demo-box code{background:#fff;border:1px solid var(--line);padding:0 4px;border-radius:3px}
.ok-msg{background:var(--pri-50);border:1px solid var(--pri-200);padding:9px 11px;border-radius:var(--r);font-size:13px;margin-bottom:12px}
.bad-msg{background:var(--danger-l);border:1px solid #e7b5b1;padding:9px 11px;border-radius:var(--r);font-size:13px;margin-bottom:12px}

/* ---------- Shell ---------- */
#shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--hdr) minmax(0,1fr);height:100vh}
body.sb-hidden #shell{grid-template-columns:0 minmax(0,1fr)}
#hdr{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:3px solid var(--pri);z-index:30}
#hdr .burger{font-size:16px;width:34px;height:34px}
#hdr .title{font-weight:700;font-size:16px;letter-spacing:.3px;color:var(--ink);white-space:nowrap}
#hdr .title i{color:var(--pri);margin-right:8px}
#hdr .sp{flex:1}
.hd-date{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;white-space:nowrap}
.user-chip{display:flex;align-items:center;gap:9px;padding:3px 10px 3px 4px;border:1px solid var(--line);border-radius:30px;background:#fff;cursor:pointer;position:relative}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.uc-name{font-size:13px;font-weight:600;line-height:1.1}
.uc-role{font-size:11px;color:var(--ink3)}
.pop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:12px;z-index:60;font-size:12.5px;cursor:default}
.pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.pop dt{color:var(--ink3)}.pop dd{margin:0;word-break:break-all}
#side{grid-column:1;background:#fff;border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:10px 8px;z-index:20}
body.sb-hidden #side{display:none}
.nav a,.nav .grp{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r);color:var(--ink);text-decoration:none;cursor:pointer;font-size:13.5px;user-select:none}
.nav a:hover,.nav .grp:hover{background:var(--pri-50)}
.nav a.active{background:var(--pri);color:#fff}
.nav i.ic{width:18px;text-align:center;color:var(--pri-d)}
.nav a.active i.ic{color:#fff}
.nav .grp .pm{margin-left:auto;color:var(--ink3);font-weight:700;font-size:15px;line-height:1}
.nav .sub{margin:2px 0 4px 18px;border-left:2px solid var(--pri-100);padding-left:6px}
.nav .sub a{padding:7px 10px;font-size:13px}
#main{grid-column:2;overflow:auto;padding:16px 18px;min-width:0}
.ov-side{display:none}

/* ---------- Page ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{font-size:20px}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tab{padding:8px 16px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;background:transparent;font-size:13px;color:var(--ink2)}
.tab.on{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600;margin-bottom:-1px;box-shadow:inset 0 3px 0 var(--pri)}
.gtool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.gtool .srch{position:relative;flex:0 1 260px}
.gtool .srch i{position:absolute;left:10px;top:10px;color:var(--ink3);font-size:12px}
.gtool .srch .inp{padding-left:30px;height:32px}
.gtool .sel{width:auto;height:32px;min-width:110px;font-size:12.5px}
.gtool .gr{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:40;min-width:150px;overflow:hidden}
.menu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:#fff;padding:8px 12px;text-align:left;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--pri-50)}
.menu button[disabled]{color:var(--ink3);cursor:not-allowed}

/* ---------- Table ---------- */
.tbl-wrap{position:relative;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 262px);min-height:120px}
table.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.tbl th{position:sticky;top:0;z-index:2;background:#e9f2f6;color:var(--ink);text-align:left;font-weight:600;font-size:11px;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{background:var(--pri-100)}
.tbl th .sa{color:var(--pri-d);font-size:10px;margin-left:2px}
.tbl td{padding:5px 4px;border-top:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tbl tbody tr:hover td{background:var(--pri-50)}
.tbl td.c,.tbl th.c{text-align:center}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.act{text-align:center}
.tbl td.act .ib{margin:0 -1px}
.tbl .sel-i{width:100%;height:26px;font-size:11.5px;padding:0 2px;border:1px solid #c5ccd2;border-radius:4px;background:#fff;text-overflow:ellipsis}
.tbl .sel-i[disabled]{background:#eef0f2;color:#80878d;cursor:not-allowed}
.tbl .cur{color:var(--ink3);font-size:10.5px;margin-right:3px}
@media (max-width:1279px){table.tbl{min-width:1040px}}
@keyframes blinkRow{0%,100%{background:#fff}50%{background:var(--warn-l)}}
tr.overdue td{animation:blinkRow 1.3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){tr.overdue td{animation:none;background:var(--warn-l)}}
.loading,.empty{padding:34px 10px;text-align:center;color:var(--ink3)}
.empty i,.loading i{font-size:22px;display:block;margin-bottom:8px;color:var(--pri-200)}
.pager{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.pager .sp{flex:1}
.pager .pg{min-width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:12px}
.pager .pg.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pager .pg[disabled]{opacity:.4;cursor:not-allowed}
.pager .sel{width:auto;height:28px;font-size:12px}

/* ---------- Badges ---------- */
.pr{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:4px;font-weight:700;font-size:12px;color:#fff}
.pr-C{background:#1a1a1a}.pr-H{background:#555c63}.pr-M{background:var(--pri)}.pr-L{background:var(--pri-200);color:var(--ink)}
.ap{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:3px;font-weight:700;font-size:11px;border:1px solid var(--line)}
.ap-A{background:var(--pri);color:#fff;border-color:var(--pri)}.ap-R{background:#1a1a1a;color:#fff;border-color:#1a1a1a}.ap-P{background:#fff;color:var(--ink);border-color:#8b939a}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;border:1px solid var(--line);background:#fff}
.st-Draft{color:var(--ink2);border-style:dashed}.st-New{background:var(--pri-50);border-color:var(--pri-200)}
.st-Pending{background:var(--pri-100)}.st-Approved{background:var(--pri-200)}.st-Assigned{background:#7fbcd4}
.st-InProgress{background:var(--pri);color:#fff;border-color:var(--pri)}.st-Completed{background:#4a5157;color:#fff;border-color:#4a5157}
.st-Closed{background:#1a1a1a;color:#fff;border-color:#1a1a1a}.st-Rejected{background:#fff;color:var(--ink);border-color:#1a1a1a;text-decoration:line-through}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--pri-100);font-size:11px}

/* ---------- Modal / Toast ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(20,28,34,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:#fff;border-radius:10px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.35)}
.modal.lg{width:min(860px,100%)}.modal.sm{width:min(430px,100%)}
.m-head{padding:14px 18px;border-bottom:1px solid var(--line);border-top:4px solid var(--pri);border-radius:10px 10px 0 0}
.m-head h3{font-size:16px}
.m-body{padding:16px 18px;overflow:auto}
.m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:#f8fafb;border-radius:0 0 10px 10px}
body.modal-open{overflow:hidden}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:400;max-width:min(380px,calc(100vw - 32px))}
.toast{background:#fff;border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:6px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13px;display:flex;gap:9px;align-items:flex-start}
.toast.error{border-left-color:var(--danger)}.toast.info{border-left-color:#7b838a}
.toast i{margin-top:2px}.toast.error i{color:var(--danger)}.toast.success i{color:var(--pri-d)}
.dgrid{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.dgrid dt{color:var(--ink3)}.dgrid dd{margin:0;word-break:break-word}
.dbox{white-space:pre-wrap;background:#f7f9fa;border:1px solid var(--line2);border-radius:6px;padding:10px;font-size:13px;margin:6px 0 12px;max-height:180px;overflow:auto}
.sect{font-size:12px;font-weight:700;color:var(--pri-dd);margin:14px 0 6px;border-bottom:1px solid var(--line2);padding-bottom:3px}
.mini{width:100%;border-collapse:collapse;font-size:12px}
.mini th{background:#eef3f6;text-align:left;padding:4px 6px}.mini td{padding:4px 6px;border-top:1px solid var(--line2)}
.cm{border-left:3px solid var(--pri-200);padding:2px 8px;margin:5px 0;font-size:12.5px}
.cm small{color:var(--ink3)}

/* ---------- Home / Reports / Settings ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.welcome h2{font-size:22px;margin-bottom:4px}
.welcome p{margin:0;color:var(--ink2)}
.cal{width:100%;border-collapse:collapse;text-align:center;font-size:13px}
.cal th{font-size:11.5px;color:var(--ink3);padding:6px 0;font-weight:600}
.cal td{padding:7px 0;border-radius:6px}
.cal td.today{background:var(--pri);color:#fff;font-weight:700}
.cal td.dim{color:#b2b8bd}
.cal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.clock-card{display:flex;flex-direction:column;align-items:center;gap:8px}
.digital{font-size:20px;font-weight:600;letter-spacing:1px}
.rep-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px;padding:10px 12px}
.rep-filters .field{margin:0;min-width:140px}
.rep-filters .inp,.rep-filters .sel{height:32px}
.totals{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-size:13px}
.totals b{font-size:14px}
.stat-click{cursor:pointer;padding:4px 10px;border-radius:8px;border:1px solid transparent}
.stat-click:hover{background:var(--pri-50);border-color:var(--pri-200)}
.sum-tbl{width:100%;max-width:520px;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.sum-tbl th{background:#e9f2f6;text-align:left;padding:6px 8px}.sum-tbl td{padding:6px 8px;border-top:1px solid var(--line2)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.set-grid h3{font-size:15px;margin-bottom:10px}
.imp-sum{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.imp-sum div{border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:#f8fafb;font-size:12px}
.imp-sum b{display:block;font-size:17px}
.imp-tbl-wrap{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.rw-ok{color:var(--pri-d)}.rw-bad{color:var(--danger)}.rw-dup{color:var(--ink3)}

<script>
'use strict';
/* =====================================================================
   ADMIN PROCUREMENT & TRACKING
   Sections: Config | Utilities | Validation | Database Service | State |
   Workflow | Authentication | Navigation | Masters | Ticket Requests |
   Admin Manager | Admin Executive | Approver | Reports | Settings |
   Import/Export
   ===================================================================== */

/* ===================== CONFIG (public values only) ===================== */
const APP_CONFIG = {
  APP_NAME: 'ADMIN PROCUREMENT & TRACKING',
  SUPABASE_URL: '',          // e.g. https://xxxx.supabase.co  (public project URL) - or set in Settings > Database
  SUPABASE_ANON_KEY: '',     // PUBLIC anon/publishable key ONLY. Never paste a service-role/secret key here.
  API_PREFIX: '/rest/v1',    // use '' when you move to your own PostgREST server on Linux
  LOCAL_DB_KEY: 'apt_local_db_v1',
  CONN_KEY: 'apt_connection_v1',
  SESSION_KEY: 'apt_session_v1',
  DEFAULT_SESSION_MINUTES: 30,
  PAGE_SIZE: 15
};
const ROLE = { REQ: 'Requestor', EXE: 'Admin Executive', MGR: 'Admin Manager', APR: 'Approver' };
const USER_TYPES = [ROLE.REQ, ROLE.EXE, ROLE.MGR, ROLE.APR];
const CORE_STATUSES = ['Draft', 'New', 'Pending Approval', 'Approved', 'Assigned', 'In-Progress', 'Completed', 'Closed', 'Rejected'];
const TABLES = ['employees', 'vendors', 'categories', 'priorities', 'statuses', 'currencies', 'recurring_master', 'users', 'tickets',
  'ticket_comments', 'ticket_assignments', 'ticket_approvals', 'ticket_status_history', 'audit_log', 'app_settings'];
const DATA_TABLES = ['employees', 'vendors', 'categories', 'priorities', 'statuses', 'currencies', 'recurring_master', 'tickets',
  'ticket_comments', 'ticket_assignments', 'ticket_approvals', 'ticket_status_history', 'app_settings'];

function getConn() {
  try { const c = JSON.parse(localStorage.getItem(APP_CONFIG.CONN_KEY) || 'null'); if (c) return c; } catch (e) { /* ignore */ }
  return { mode: 'auto', url: APP_CONFIG.SUPABASE_URL, key: APP_CONFIG.SUPABASE_ANON_KEY, prefix: APP_CONFIG.API_PREFIX };
}
function isSecretKey(k) {
  if (!k) return false;
  if (/^sb_secret_/i.test(k)) return true;
  try { const p = JSON.parse(atob(k.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.role === 'service_role'; } catch (e) { return false; }
}
function connMode() {
  const c = getConn();
  if (c.mode === 'demo') return 'demo';
  if (c.url && c.key && !isSecretKey(c.key)) return 'cloud';
  return 'demo';
}

/* ===================== UTILITIES ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const pad4 = n => String(n).padStart(4, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function parseD(s) { // 'YYYY-MM-DD' -> local Date
  if (s instanceof Date) return s;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(NaN);
}
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const tstr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const todayStr = () => dstr(new Date());
function fmtD(s, long) { const d = parseD(s); if (isNaN(d)) return ''; return long ? `${pad(d.getDate())}-${MON[d.getMonth()]}-${d.getFullYear()}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`; }
const fmtT = s => (s || '').slice(0, 5);
function fmtDT(iso) { const d = new Date(iso); return isNaN(d) ? '' : `${fmtD(dstr(d), true)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const money = n => Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const nowISO = () => new Date().toISOString();
function addDays(dateStr, n) { const d = parseD(dateStr); d.setDate(d.getDate() + n); return dstr(d); }
function addMonthsClamp(dateStr, n) {
  const d = parseD(dateStr), day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(day, last)); return dstr(t);
}
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
class AppError extends Error { }
class DbError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
function friendly(e) {
  if (e instanceof AppError) return e.message;
  if (e instanceof DbError) {
    if (e.code === 'DUP') return e.message || 'Duplicate record.';
    if (e.code === 'FORBIDDEN') return 'Unauthorized action.';
    if (e.code === 'INUSE') return 'This record is in use and cannot be deleted.';
    if (e.code === 'NET') return 'Database connection failure. Check your internet connection or database settings.';
    return e.message || 'The database rejected this change.';
  }
  console.error(e); return 'Something went wrong. Please try again.';
}
function download(name, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin + ':apt');
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; data.forEach(b => { h = ((h << 5) + h + b) >>> 0; }); return 'f' + h.toString(16);
}
const rnd = () => Math.random().toString(36).slice(2, 10);

/* ===================== VALIDATION ===================== */
const V = {
  email: s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s).trim()),
  pin: s => /^\d{4}$/.test(String(s)),
  username: s => /^[A-Za-z0-9_.]{3,20}$/.test(String(s)),
  money: s => /^\d{1,12}(\.\d{1,2})?$/.test(String(s).trim()),
  phone: s => /^\+?[\d\s-]{7,15}$/.test(String(s).trim()),
  gst: s => /^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(String(s).trim().toUpperCase()),
  date: s => /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && !isNaN(parseD(s))
};
function parseDateFlex(v) { // accepts yyyy-mm-dd, dd-mm-yyyy, dd/mm/yyyy, Date
  if (v instanceof Date) return isNaN(v) ? null : dstr(v);
  const s = String(v || '').trim(); if (!s) return '';
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/.exec(s); if (m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return null;
}

/* ===================== DATABASE SERVICE =====================
   Everything below talks to storage. The UI only calls the DB facade.
   - LocalDB : demo mode (browser localStorage)
   - CloudDB : Supabase / any PostgREST server (see supabase_schema.sql)
   To move to your own Linux server later, keep the same schema on PostgreSQL + PostgREST
   and change URL / API prefix in Settings > Database (or replace CloudDB with your own API client).
   ===================================================================== */
const UNIQUE = {
  employees: [['emp_code'], ['email']], vendors: [['vendor_code']], categories: [['name']], priorities: [['name'], ['code']],
  statuses: [['name']], currencies: [['name']], users: [['username']], app_settings: [['key']]
};
const CHILD_TABLES = ['ticket_comments', 'ticket_assignments', 'ticket_approvals', 'ticket_status_history'];

const LocalDB = {
  mode: 'demo', d: null,
  async init() {
    const raw = localStorage.getItem(APP_CONFIG.LOCAL_DB_KEY);
    if (raw) { try { this.d = JSON.parse(raw); } catch (e) { this.d = null; } }
    if (!this.d) { this.d = await seedLocal(); this.persist(); }
  },
  persist() { localStorage.setItem(APP_CONFIG.LOCAL_DB_KEY, JSON.stringify(this.d)); },
  sync() { const raw = localStorage.getItem(APP_CONFIG.LOCAL_DB_KEY); if (raw) this.d = JSON.parse(raw); },
  async list(t) { this.sync(); return clone(this.d.t[t] || []); },
  uniq(t, row, selfId) {
    const rows = this.d.t[t];
    (UNIQUE[t] || []).forEach(cols => {
      if (cols.some(c => row[c] == null || row[c] === '')) return;
      const hit = rows.find(r => r.id !== selfId && cols.every(c => String(r[c]).toLowerCase() === String(row[c]).toLowerCase()));
      if (hit) throw new DbError('DUP', `Duplicate record: ${cols.join(', ')} already exists.`);
    });
    if (t === 'tickets' && row.recurring_id && row.occurrence_date) {
      const hit = rows.find(r => r.id !== selfId && r.recurring_id === row.recurring_id && r.occurrence_date === row.occurrence_date);
      if (hit) throw new DbError('DUP', 'A ticket already exists for this recurring item and due date.');
    }
  },
  async insert(t, row) {
    this.sync(); row = clone(row); this.uniq(t, row, null);
    const now = nowISO(); row.id = ++this.d.seq[t];
    if (t === 'tickets') {
      row.ticket_no = 'TKT-' + pad4(++this.d.cnt.ticket);
      row.request_no = row.source === 'Request' ? 'REQ-' + pad4(++this.d.cnt.request) : null;
      row.created_at = now; row.updated_at = now; row.updated_by = row.created_by; row.closed_at = null;
    } else if (!row.created_at) row.created_at = now;
    this.d.t[t].push(row); this.persist(); return clone(row);
  },
  async insertMany(t, rows) { const out = []; for (const r of rows) out.push(await this.insert(t, r)); return out; },
  async update(t, id, patch) {
    this.sync(); const r = this.d.t[t].find(x => x.id === id); if (!r) throw new DbError('NF', 'Record not found.');
    const next = Object.assign({}, r, clone(patch)); this.uniq(t, next, id);
    Object.assign(r, clone(patch)); if (t === 'tickets') r.updated_at = nowISO();
    this.persist(); return clone(r);
  },
  async remove(t, id) {
    this.sync(); this.d.t[t] = this.d.t[t].filter(x => x.id !== id);
    if (t === 'tickets') CHILD_TABLES.forEach(c => { this.d.t[c] = this.d.t[c].filter(x => x.ticket_id !== id); });
    this.persist();
  },
  buildUser(u) {
    const e = this.d.t.employees.find(x => x.id === u.emp_id) || {};
    return { id: u.id, username: u.username, emp_id: u.emp_id, role: e.user_type, name: e.name, email: e.email, designation: e.designation, branch: e.branch, emp_code: e.emp_code, menu_access: u.menu_access == null ? null : u.menu_access };
  },
  async register({ email, username, pin }) {
    this.sync(); const T = this.d.t; const em = email.trim().toLowerCase();
    if (T.users.some(u => u.username.toLowerCase() === username.toLowerCase())) throw new AppError('Username already exists. Choose another username.');
    let emp = T.employees.find(e => e.email.toLowerCase() === em);
    if (T.users.some(u => emp && u.emp_id === emp.id)) throw new AppError('This email address is already registered.');
    if (!T.users.length) { // first-run bootstrap: first user becomes Admin Manager
      if (!emp) emp = await this.insert('employees', { emp_code: 'ADM001', name: username, designation: 'Admin Manager', branch: '', email: email.trim(), mobile: '', user_type: ROLE.MGR });
      else await this.update('employees', emp.id, { user_type: ROLE.MGR });
      this.sync();
    } else if (!emp) throw new AppError('This email address is not in the Employee master. Please contact the Admin Manager.');
    const salt = rnd();
    await this.insert('users', { username, emp_id: emp.id, salt, pin_hash: await hashPin(pin, salt), active: true, failed_attempts: 0, locked_until: null, last_login: null, reset_requested: false });
  },
  async login(username, pin) {
    this.sync(); const u = this.d.t.users.find(x => x.username.toLowerCase() === String(username).trim().toLowerCase());
    if (!u) throw new AppError('Invalid username or PIN.');
    if (u.locked_until && new Date(u.locked_until) > new Date()) throw new AppError('Account temporarily locked after failed attempts. Try again in a few minutes.');
    if (!u.active) throw new AppError('Account is disabled. Contact the Admin Manager.');
    if (await hashPin(pin, u.salt) !== u.pin_hash) {
      u.failed_attempts = (u.failed_attempts || 0) + 1;
      if (u.failed_attempts >= 5) { u.locked_until = new Date(Date.now() + 5 * 60000).toISOString(); u.failed_attempts = 0; }
      this.persist(); throw new AppError('Invalid username or PIN.');
    }
    u.failed_attempts = 0; u.locked_until = null; u.last_login = nowISO(); this.persist();
    sessionStorage.setItem(APP_CONFIG.SESSION_KEY, JSON.stringify({ uid: u.id }));
    return this.buildUser(u);
  },
  async restore() {
    this.sync(); let s; try { s = JSON.parse(sessionStorage.getItem(APP_CONFIG.SESSION_KEY) || 'null'); } catch (e) { s = null; }
    if (!s) return null; const u = this.d.t.users.find(x => x.id === s.uid && x.active); return u ? this.buildUser(u) : null;
  },
  async logout() { sessionStorage.removeItem(APP_CONFIG.SESSION_KEY); },
  async forgot(email) {
    this.sync(); const em = email.trim().toLowerCase(); const e = this.d.t.employees.find(x => x.email.toLowerCase() === em);
    const u = e && this.d.t.users.find(x => x.emp_id === e.id); if (!u) return false;
    u.reset_requested = true; this.persist(); return true;
  },
  async listUsers() {
    this.sync(); return this.d.t.users.map(u => { const e = this.d.t.employees.find(x => x.id === u.emp_id) || {}; return { id: u.id, username: u.username, name: e.name, email: e.email, role: e.user_type, active: u.active, last_login: u.last_login, reset_requested: !!u.reset_requested, locked: !!(u.locked_until && new Date(u.locked_until) > new Date()), menu_access: u.menu_access == null ? null : u.menu_access }; });
  },
  async setMenuAccess(id, arr) { this.sync(); const u = this.d.t.users.find(x => x.id === id); if (!u) throw new DbError('NF', 'Record not found.'); u.menu_access = arr; this.persist(); },
  async resetPin(id, pin) { this.sync(); const u = this.d.t.users.find(x => x.id === id); u.salt = rnd(); u.pin_hash = await hashPin(pin, u.salt); u.reset_requested = false; u.failed_attempts = 0; u.locked_until = null; this.persist(); },
  async setUserActive(id, active) { this.sync(); const u = this.d.t.users.find(x => x.id === id); u.active = active; this.persist(); },
  async removeDemo() { this.sync(); TABLES.forEach(t => { this.d.t[t] = this.d.t[t].filter(r => !r.is_demo); }); this.persist(); },
  async resetDemo() { localStorage.removeItem(APP_CONFIG.LOCAL_DB_KEY); this.d = await seedLocal(); this.persist(); },
  async testConnection() { return { ok: true, msg: 'Demo mode: data is stored in this browser only.' }; },
  hasDemo() { this.sync(); return TABLES.some(t => this.d.t[t].some(r => r.is_demo)); }
};

const CloudDB = {
  mode: 'cloud', token: null,
  cfg() { const c = getConn(); return { base: c.url.replace(/\/+$/, '') + (c.prefix ?? APP_CONFIG.API_PREFIX), key: c.key }; },
  headers(extra) {
    const { key } = this.cfg(); const h = Object.assign({ apikey: key, 'Content-Type': 'application/json' }, extra || {});
    if (/^eyJ/.test(key)) h.Authorization = 'Bearer ' + key;
    if (this.token) h['x-app-token'] = this.token;
    return h;
  },
  async req(method, path, body, extra) {
    const { base } = this.cfg(); let res;
    try { res = await fetch(base + path, { method, headers: this.headers(extra), body: body === undefined ? undefined : JSON.stringify(body) }); }
    catch (e) { throw new DbError('NET', 'Database connection failure.'); }
    if (!res.ok) {
      let j = {}; try { j = await res.json(); } catch (e) { /* ignore */ }
      const msg = j.message || res.statusText;
      if (j.code === '23505') throw new DbError('DUP', 'Duplicate record already exists.');
      if (j.code === '23503') throw new DbError('INUSE', 'Record is in use.');
      if (res.status === 401 || res.status === 403 || j.code === '42501') throw new DbError('FORBIDDEN', 'Unauthorized action.');
      throw new DbError('DB', msg);
    }
    if (res.status === 204) return null;
    const txt = await res.text(); return txt ? JSON.parse(txt) : null;
  },
  async rpc(name, args) { return this.req('POST', '/rpc/' + name, args || {}); },
  async list(t) {
    let all = [], from = 0; const step = 1000;
    for (;;) {
      const rows = await this.req('GET', `/${t}?select=*&order=id.asc`, undefined, { Range: `${from}-${from + step - 1}`, 'Range-Unit': 'items' });
      all = all.concat(rows || []); if (!rows || rows.length < step) break; from += step;
    }
    return all;
  },
  async insert(t, row) { const r = await this.req('POST', `/${t}`, row, { Prefer: 'return=representation' }); return r[0]; },
  async insertMany(t, rows) { if (!rows.length) return []; return this.req('POST', `/${t}`, rows, { Prefer: 'return=representation' }); },
  async update(t, id, patch) { const r = await this.req('PATCH', `/${t}?id=eq.${id}`, patch, { Prefer: 'return=representation' }); if (!r || !r.length) throw new DbError('FORBIDDEN', 'Unauthorized action.'); return r[0]; },
  async remove(t, id) { await this.req('DELETE', `/${t}?id=eq.${id}`); },
  async chk(p) { const r = await p; if (r && r.ok === false) throw new AppError(r.error || 'Request failed.'); return r; },
  async register({ email, username, pin }) { await this.chk(this.rpc('app_register', { p_email: email, p_username: username, p_pin: pin })); },
  async login(username, pin) {
    const r = await this.chk(this.rpc('app_login', { p_username: username, p_pin: pin }));
    this.token = r.token; sessionStorage.setItem(APP_CONFIG.SESSION_KEY, r.token); return r.user;
  },
  async restore() {
    const tk = sessionStorage.getItem(APP_CONFIG.SESSION_KEY); if (!tk) return null; this.token = tk;
    try { const r = await this.rpc('app_me'); if (r && r.ok && r.user) return r.user; } catch (e) { /* fallthrough */ }
    this.token = null; sessionStorage.removeItem(APP_CONFIG.SESSION_KEY); return null;
  },
  async logout() { try { await this.rpc('app_logout'); } catch (e) { /* ignore */ } this.token = null; sessionStorage.removeItem(APP_CONFIG.SESSION_KEY); },
  async forgot(email) { const r = await this.chk(this.rpc('app_forgot', { p_email: email })); return !!r.registered; },
  async listUsers() { const r = await this.chk(this.rpc('admin_list_users')); return r.users || []; },
  async setMenuAccess(id, arr) { await this.chk(this.rpc('admin_set_menu_access', { p_user_id: id, p_menu_access: arr })); },
  async resetPin(id, pin) { await this.chk(this.rpc('admin_reset_pin', { p_user_id: id, p_pin: pin })); },
  async setUserActive(id, active) { await this.chk(this.rpc('admin_set_user_active', { p_user_id: id, p_active: active })); },
  async removeDemo() {
    for (const t of ['ticket_comments', 'ticket_assignments', 'ticket_approvals', 'ticket_status_history', 'tickets', 'recurring_master', 'vendors', 'categories', 'employees'])
      await this.req('DELETE', `/${t}?is_demo=eq.true`);
  },
  async resetDemo() { throw new AppError('Reset is available in demo mode only.'); },
  async testConnection() {

// Allowed status transitions by role. (Some "hidden" ones are used only by the approver-change action.)
const TRANSITIONS = {
  [ROLE.MGR]: {
    'Draft': ['New', 'Pending Approval', 'Assigned', 'Rejected'], 'New': ['Pending Approval', 'Assigned', 'Rejected'],
    'Approved': ['Assigned', 'Rejected', 'Pending Approval'], 'Assigned': ['In-Progress', 'Pending Approval'],
    'In-Progress': ['Completed'], 'Completed': ['Closed']
  },
  [ROLE.APR]: { 'Pending Approval': ['Approved', 'Rejected'] },
  [ROLE.EXE]: { 'Assigned': ['In-Progress'], 'In-Progress': ['Completed'] },
  [ROLE.REQ]: {}
};
const isActiveStatus = s => !['Completed', 'Closed', 'Rejected'].includes(s);
const approvalOK = t => !t.approval_required || t.approval_status === 'Approved';
const canAssignNow = t => approvalOK(t) && ['Draft', 'New', 'Approved', 'Assigned'].includes(t.status);
const approverEditable = t => !!t.approval_required && ['Draft', 'New', 'Pending Approval', 'Approved', 'Assigned'].includes(t.status);
const canDeleteTicket = t => (ME.role === ROLE.MGR && ['Draft', 'New'].includes(t.status)) || (ME.role === ROLE.REQ && t.requested_by === ME.emp_id && t.status === 'Draft');
function handlerLockReason(t) {
  if (t.approval_required && t.approval_status === 'Pending') return 'Awaiting approver action';
  if (t.approval_required && t.approval_status === 'Rejected') return 'Approval rejected';
  if (t.approval_required && t.approval_status !== 'Approved') return 'Send for approval first';
  if (!canAssignNow(t)) return 'Work already started or ticket closed';
  return '';
}
function nextStatuses(role, t) {
  const list = (TRANSITIONS[role] || {})[t.status] || [];
  return list.filter(to => {
    if (role === ROLE.MGR) {
      if (to === 'Pending Approval') return ['Draft', 'New'].includes(t.status) && t.approval_required && !!t.approver_id && !['Pending', 'Approved'].includes(t.approval_status);
      if (to === 'Assigned') return approvalOK(t) && !!t.handler_id && ['Draft', 'New', 'Approved'].includes(t.status);
    }
    return true;
  });
}

async function setApprover(t, approverId) {
  requireRole(ROLE.MGR);
  if (!approverEditable(t)) throw new AppError('The approver cannot be changed at this stage.');
  const a = emp(approverId); if (!a || a.user_type !== ROLE.APR) throw new AppError('Select a valid approver.');
  if (t.approver_id === approverId) return;
  const old = empName(t.approver_id) || 'none';
  if (['Approved', 'Assigned'].includes(t.status)) {               // decision already given -> fresh approval needed
    await DB.update('tickets', t.id, { approver_id: approverId, approval_status: 'Pending', status: 'Pending Approval', handler_id: null, updated_by: ME.id });
    await logStatus(t, 'Pending Approval', 'Approver changed to ' + a.name + ' - fresh approval required');
    await DB.insert('ticket_approvals', { ticket_id: t.id, approver_id: approverId, sent_by: ME.id, sent_at: nowISO(), decision: 'Pending', decided_at: null, comments: null });
  } else if (t.status === 'Pending Approval') {                    // re-route the pending request
    await DB.update('tickets', t.id, { approver_id: approverId, updated_by: ME.id });
    const pend = S.ticket_approvals.filter(x => x.ticket_id === t.id && x.decision === 'Pending').pop();
    if (pend) await DB.update('ticket_approvals', pend.id, { approver_id: approverId });
    else await DB.insert('ticket_approvals', { ticket_id: t.id, approver_id: approverId, sent_by: ME.id, sent_at: nowISO(), decision: 'Pending', decided_at: null, comments: null });
  } else await DB.update('tickets', t.id, { approver_id: approverId, updated_by: ME.id });
  await addComment(t, `Approver changed from ${old} to ${a.name}`);

  const x = emp(execId); if (!x || x.user_type !== ROLE.EXE) throw new AppError('Select a valid Admin Executive.');
  if (t.handler_id === execId) return;
  const old = empName(t.handler_id), toAssigned = t.status !== 'Assigned', patch = { handler_id: execId, updated_by: ME.id };
  if (toAssigned) patch.status = 'Assigned';
  await DB.update('tickets', t.id, patch);

  if (toAssigned) await logStatus(t, 'Assigned', 'Assigned to ' + x.name); else await addComment(t, `Reassigned from ${old} to ${x.name}`);

async function changeStatus(t, to, comment) {
  const role = ME.role;
  if (role === ROLE.EXE && t.handler_id !== ME.emp_id) throw new AppError('Unauthorized action.');
  if (role === ROLE.APR && t.approver_id !== ME.emp_id) throw new AppError('Unauthorized action.');
  if (!nextStatuses(role, t).includes(to)) throw new AppError('This status change is not allowed.');
  if (to === 'Pending Approval') return sendForApproval(t);
  if (to === 'Rejected' && role === ROLE.MGR && !String(comment || '').trim()) throw new AppError('Enter a reason for rejection.');
  const patch = { status: to, updated_by: ME.id }; if (to === 'Closed') patch.closed_at = nowISO();
  if (role === ROLE.APR) patch.approval_status = to;
  await DB.update('tickets', t.id, patch);
  await logStatus(t, to, comment); await addComment(t, comment);
  Audit.log(to === 'Closed' ? 'Close' : (to === 'Approved' ? 'Approve' : (to === 'Rejected' ? 'Reject' : 'StatusChange')), 'Ticket', t.ticket_no, `${t.status} -> ${to}`);
}
async function decideApproval(t, decision, comment) {
  requireRole(ROLE.APR);
  if (t.approver_id !== ME.emp_id || t.status !== 'Pending Approval') throw new AppError('This ticket is not pending your approval.');
  if (decision === 'Rejected' && !String(comment || '').trim()) throw new AppError('Enter a comment for rejection.');
  await changeStatus(t, decision, comment);
  const pend = S.ticket_approvals.filter(x => x.ticket_id === t.id && x.decision === 'Pending').pop();
  if (pend) await DB.update('ticket_approvals', pend.id, { decision, decided_at: nowISO(), comments: comment || null });
}

/* ===================== RECURRING ENGINE =====================
   Due Date is the first due date; the cost repeats monthly on the same day until End Date.
   Only the latest due occurrence (<= today) is generated, once (no duplicates, no back-fill). */
async function runRecurring() {
  if (!ME || ME.role !== ROLE.MGR) return 0;
  await loadData(['recurring_master', 'tickets', 'vendors', 'priorities', 'currencies', 'app_settings', 'categories']);
  const today = todayStr(); let made = 0;
  for (const r of S.recurring_master) {
    if (!r.due_date || today < r.due_date) continue;
    const dd = parseD(r.due_date), td = parseD(today);
    let k = (td.getFullYear() - dd.getFullYear()) * 12 + (td.getMonth() - dd.getMonth());
    let occ = addMonthsClamp(r.due_date, k); if (occ > today) { k--; occ = addMonthsClamp(r.due_date, k); }
    if (k < 0) continue;
    if (r.end_date && occ > r.end_date) continue;
    if (S.tickets.some(t => t.recurring_id === r.id && t.occurrence_date === occ)) continue;
    const v = vendor(r.vendor_id);
    const priId = +setting('rec_priority_id', 0) || (byName('priorities', 'Medium') || S.priorities[0] || {}).id;
    const curId = +setting('rec_currency_id', 0) || (S.currencies[0] || {}).id;
    try {
      await createTicket({
        requested_by: null, category_id: v ? v.category_id : null, details: `Recurring: ${r.cost_name} - ${r.location || ''} (due ${fmtD(occ, true)})`.slice(0, 250),
        vendor_id: r.vendor_id, currency_id: curId, cost: r.amount, priority_id: priId, approval_required: false, recurring_id: r.id, occurrence_date: occ
      }, 'Recurring');
      made++;
    } catch (e) { if (!(e instanceof DbError && e.code === 'DUP')) console.error(e); }
  }
  if (made) await loadData(TICKET_TABLES);
  return made;
}

/* ===================== UI FRAMEWORK: toast, modal, forms ===================== */
function toast(msg, type = 'success') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  const ic = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' }[type] || 'fa-circle-info';
  el.innerHTML = `<i class="fa-solid ${ic}"></i><div>${esc(msg)}</div>`;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), type === 'error' ? 6000 : 3500);
}
const Modal = {
  // Modals NEVER close when the backdrop is clicked. They close only through their own buttons
  // (or Esc for read-only viewers created with escClose:true).
  open(o) {
    const ov = document.createElement('div'); ov.className = 'modal-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = `<div class="modal ${o.size || ''}"><div class="m-head"><h3>${esc(o.title)}</h3></div><div class="m-body">${o.html || ''}</div><div class="m-foot"></div></div>`;
    const ctx = { el: ov, body: $('.m-body', ov), $: s => $(s, ov), close() { document.removeEventListener('keydown', onKey); ov.remove(); if (!$('.modal-ov')) document.body.classList.remove('modal-open'); } };
    const onKey = e => { if (e.key === 'Escape' && o.escClose) { const all = $$('.modal-ov'); if (all[all.length - 1] === ov) ctx.close(); } };
    if (o.escClose) document.addEventListener('keydown', onKey);
    (o.buttons || []).forEach(b => {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn ' + (b.cls || '');
      btn.innerHTML = (b.icon ? `<i class="fa-solid ${b.icon}"></i>` : '') + esc(b.label);
      btn.onclick = async () => {
        btn.disabled = true;
        try { const r = b.onClick ? await b.onClick(ctx) : undefined; if (r !== false) ctx.close(); }
        catch (e) { toast(friendly(e), 'error'); } finally { btn.disabled = false; }
      };
      $('.m-foot', ov).appendChild(btn);
    });
    document.body.appendChild(ov); document.body.classList.add('modal-open');
    if (o.onMount) o.onMount(ctx);
    if (!o.noFocus) { const f = $('input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled])', ctx.body); if (f) f.focus(); }
    return ctx;
  }
};

class DataGrid {
  constructor(cfg) { this.cfg = cfg; this.q = ''; this.f = {}; this.sk = null; this.sd = 1; this.page = 1; this.ps = cfg.pageSize || APP_CONFIG.PAGE_SIZE; this.loading = false; this.error = ''; }
  mount(host) {
    this.host = host; const c = this.cfg;
    host.innerHTML = `<div class="gtool"><div class="srch"><i class="fa-solid fa-magnifying-glass"></i><input class="inp" type="search" placeholder="${esc(c.searchPh || 'Search...')}" aria-label="Search"></div>
      ${(c.filters || []).map(f => `<select class="sel" data-f="${f.k}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}: All</option>${f.opts().map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('')}</select>`).join('')}
      <button class="btn sm" data-g="reset" title="Clear search, filters and sorting"><i class="fa-solid fa-filter-circle-xmark"></i>Clear</button>
      <div class="gr">${c.right || ''}</div></div><div class="tbl-wrap"></div><div class="pager"></div>`;
    $('.srch input', host).addEventListener('input', debounce(e => { this.q = e.target.value; this.page = 1; this.draw(); }, 150));
    $$('select[data-f]', host).forEach(s => s.addEventListener('change', () => { this.f[s.dataset.f] = s.value; this.page = 1; this.draw(); }));
    host.addEventListener('click', e => {
      const g = e.target.closest('[data-g]'); if (g && g.dataset.g === 'reset') { this.q = ''; this.f = {}; this.sk = null; this.page = 1; $('.srch input', host).value = ''; $$('select[data-f]', host).forEach(s => { s.value = ''; }); this.draw(); return; }
      const th = e.target.closest('th[data-k]'); if (th) { const k = th.dataset.k; if (this.sk === k) { if (this.sd === 1) this.sd = -1; else { this.sk = null; this.sd = 1; } } else { this.sk = k; this.sd = 1; } this.draw(); return; }
      const p = e.target.closest('[data-p]'); if (p && !p.disabled) { this.page = +p.dataset.p; this.draw(); return; }
      const tool = e.target.closest('[data-tool]'); if (tool && c.onTool && !tool.disabled) { c.onTool(tool.dataset.tool, tool, e); return; }
      const act = e.target.closest('[data-act]'); if (act && c.onAct && !act.disabled) { c.onAct(act.dataset.act, +act.dataset.id, act, e); }
    });
    host.addEventListener('change', e => { const s = e.target.closest('[data-chg]'); if (s && c.onChange) c.onChange(s.dataset.chg, +s.dataset.id, s); if (e.target.matches('.pager select')) { this.ps = +e.target.value; this.page = 1; this.draw(); } });
    this.draw();
  }
  rows() {
    const c = this.cfg; let r = c.getRows(); const q = this.q.toLowerCase();
    if (q) r = r.filter(x => c.searchText(x).toLowerCase().includes(q));
    (c.filters || []).forEach(f => { const v = this.f[f.k]; if (v) r = r.filter(x => f.test(x, v)); });
    r = r.slice(); const col = c.columns.find(x => x.k === this.sk);
    if (col && col.sort) { const d = this.sd; r.sort((a, b) => { const A = col.sort(a), B = col.sort(b); return (A < B ? -1 : A > B ? 1 : 0) * d; }); }
    else if (c.defaultCmp) r.sort(c.defaultCmp);
    return r;
  }
  setLoading(b) { this.loading = b; if (this.host) this.draw(); }
  setError(m) { this.error = m; if (this.host) this.draw(); }
  draw() {
    const c = this.cfg, wrap = $('.tbl-wrap', this.host), st = wrap.scrollTop, sl = wrap.scrollLeft;
    if (this.loading) { wrap.innerHTML = '<div class="loading"><span class="spin"></span><div>Loading...</div></div>'; $('.pager', this.host).innerHTML = ''; return; }
    if (this.error) { wrap.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>${esc(this.error)}</div>`; $('.pager', this.host).innerHTML = ''; return; }
    const all = this.rows(), total = all.length, pages = Math.max(1, Math.ceil(total / this.ps)); if (this.page > pages) this.page = pages;
    const from = (this.page - 1) * this.ps, slice = all.slice(from, from + this.ps);
    if (!total) {
      wrap.innerHTML = `<div class="empty"><i class="fa-regular fa-folder-open"></i>${esc(c.emptyMsg || 'No records found.')}</div>`;
    } else {
      wrap.innerHTML = `<table class="tbl"><colgroup>${c.columns.map(x => `<col style="width:${x.w}%">`).join('')}</colgroup>
        <thead><tr>${c.columns.map(x => `<th class="${x.cls || ''} ${x.sort ? 'sortable' : ''}" ${x.sort ? `data-k="${x.k}"` : ''} title="${esc(x.tip || x.label)}">${esc(x.label)}${this.sk === x.k ? `<span class="sa">${this.sd === 1 ? '&#9650;' : '&#9660;'}</span>` : ''}</th>`).join('')}</tr></thead>
        <tbody>${slice.map(r => `<tr data-id="${r.id}"${c.rowAttrs ? c.rowAttrs(r) : ''}>${c.columns.map(x => `<td class="${x.cls || ''}"${x.title ? ` title="${esc(x.title(r))}"` : ''}>${x.cell ? x.cell(r) : esc(r[x.k] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      wrap.scrollTop = st; wrap.scrollLeft = sl;
    }
    let pg = ''; const a = Math.max(1, this.page - 2), b = Math.min(pages, a + 4);
    for (let i = a; i <= b; i++) pg += `<button class="pg ${i === this.page ? 'on' : ''}" data-p="${i}">${i}</button>`;
    $('.pager', this.host).innerHTML = `<span>${total ? `Showing ${from + 1}-${Math.min(total, from + this.ps)} of ${total}` : '0 records'}</span><span class="sp"></span>
      <label>Rows <select class="sel">${[10, 15, 25, 50, 100].map(n => `<option ${n === this.ps ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <button class="pg" data-p="${this.page - 1}" ${this.page <= 1 ? 'disabled' : ''} aria-label="Previous page">&lsaquo;</button>${pg}<button class="pg" data-p="${this.page + 1}" ${this.page >= pages ? 'disabled' : ''} aria-label="Next page">&rsaquo;</button>`;
    updateOverdue();
  }
}

const Exp = {
  cell(v) { if (v == null) return ''; if (typeof v === 'number') return v; let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return s; }, // blocks spreadsheet formula injection
  csv(name, headers, rows) {
    const q = v => { const s = String(this.cell(v)); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    download(name + '.csv', '\uFEFF' + [headers.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n'), 'text/csv;charset=utf-8');
  },
  xlsx(name, headers, rows) {
    if (!window.XLSX) throw new AppError('Excel export needs the SheetJS library (internet connection). Use CSV instead.');
    const ws = XLSX.utils.aoa_to_sheet([headers].concat(rows.map(r => r.map(v => this.cell(v)))));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data'); XLSX.writeFile(wb, name + '.xlsx');
  }
};
const exportBtn = () => `<div class="menu-wrap"><button class="btn sm" data-tool="export-menu" title="Export the filtered list"><i class="fa-solid fa-file-export"></i>Export</button><div class="menu hidden"><button data-tool="export-csv"><i class="fa-solid fa-file-csv"></i>CSV</button><button data-tool="export-xlsx"><i class="fa-solid fa-file-excel"></i>Excel</button></div></div>`;
function toggleExportMenu(btn) { const m = btn.parentElement.querySelector('.menu'); const open = m.classList.contains('hidden'); $$('.menu').forEach(x => x.classList.add('hidden')); if (open) m.classList.remove('hidden'); }
function doExport(kind, name, headers, rows, entity) {
  try {
    if (!rows.length) { toast('Nothing to export.', 'info'); return; }
    const fn = `${name}_${todayStr()}`; kind === 'xlsx' ? Exp.xlsx(fn, headers, rows) : Exp.csv(fn, headers, rows);
    toast(`Exported ${rows.length} record(s).`); Audit.log('Export', entity, name, `${rows.length} rows (${kind})`);
  } catch (e) { toast(e instanceof AppError ? e.message : 'Export failed. Please try again.', 'error'); }
}
function downloadTemplate(name, headers, sample) { Exp.csv(name + '_template', headers, sample ? [sample] : []); toast('Sample template downloaded.'); }

const Importer = {
  norm: s => String(s == null ? '' : s).toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, ''),
  pick() { return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.csv,.xlsx,.xls'; i.onchange = () => res(i.files[0] || null); i.click(); }); },
  parseCSV(text) {
    text = text.replace(/^\uFEFF/, ''); const first = text.split(/\r?\n/)[0];
    const delim = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); } return rows;
  },
  async read(file) {
    if (file.size > 2 * 1024 * 1024) throw new AppError('File is too large (maximum 2 MB).');
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv' || ext === 'txt') return this.parseCSV(await file.text());
    if (ext === 'xlsx' || ext === 'xls') {
      if (!window.XLSX) throw new AppError('Excel import needs the SheetJS library (internet connection). Save the file as CSV and import again.');
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '', blankrows: false });
    }
    throw new AppError('Unsupported file type. Please use a .csv or .xlsx file.');
  },
  /* cfg: {entity, title, columns:[{key,label,req,parse(str)->{v}|{err}}], check(rec)->err, dupKey(rec), existing()->Set,
           insertOne(rec)->Promise, bulk(recs)->Promise (optional), done()->Promise} */
  async run(cfg) {
    try {
      const file = await this.pick(); if (!file) return;
      const grid = await this.read(file);
      if (grid.length < 2) throw new AppError('The file has no data rows.');
      const heads = grid[0].map(this.norm), idx = {}, missing = [];
      cfg.columns.forEach(c => { idx[c.key] = heads.indexOf(this.norm(c.label)); if (idx[c.key] < 0) idx[c.key] = heads.indexOf(this.norm(c.key)); if (idx[c.key] < 0 && c.req) missing.push(c.label); });
      if (missing.length) throw new AppError('Missing required column(s): ' + missing.join(', ') + '. Download the sample template for the correct headings.');
      const data = grid.slice(1).filter(r => r.some(c => String(c).trim() !== ''));
      if (!data.length) throw new AppError('The file has no data rows.');
      if (data.length > 2000) throw new AppError('Too many rows. Import up to 2000 rows at a time.');
      const existing = cfg.existing ? cfg.existing() : new Set(), seen = new Set();
      const res = data.map((r, i) => {
        const rec = {}, errs = [];
        cfg.columns.forEach(c => {
          let raw = idx[c.key] >= 0 ? r[idx[c.key]] : ''; const s = raw instanceof Date ? dstr(raw) : String(raw == null ? '' : raw).replace(/[\u0000-\u001f]/g, ' ').trim();
          if (!s) { if (c.req) errs.push(`${c.label} is required`); rec[c.key] = null; return; }
          const p = c.parse ? c.parse(s) : { v: s }; if (p.err) errs.push(`${c.label}: ${p.err}`); else rec[c.key] = p.v;
        });
        if (!errs.length && cfg.check) { const e = cfg.check(rec); if (e) errs.push(e); }
        let st = errs.length ? 'bad' : 'ok';
        if (st === 'ok' && cfg.dupKey) { const k = cfg.dupKey(rec); if (k) { if (existing.has(k) || seen.has(k)) { st = 'dup'; errs.push('Duplicate record - skipped'); } else seen.add(k); } }
        return { n: i + 2, rec, errs, st, cells: cfg.columns.slice(0, 4).map(c => String(r[idx[c.key]] ?? '')) };
      });
      const ok = res.filter(x => x.st === 'ok'), bad = res.filter(x => x.st === 'bad'), dup = res.filter(x => x.st === 'dup');
      const sum = (a, b, c, d) => `<div class="imp-sum"><div>Total rows<b>${a}</b></div><div>Successful<b>${b}</b></div><div>Failed<b>${c}</b></div><div>Duplicate<b>${d}</b></div></div>`;
      const icon = { ok: '<i class="fa-solid fa-circle-check rw-ok"></i> Valid', bad: '<i class="fa-solid fa-circle-xmark rw-bad"></i> Error', dup: '<i class="fa-solid fa-clone rw-dup"></i> Duplicate' };
      Modal.open({
        title: 'Import preview - ' + cfg.title, size: 'lg',
        html: `<p style="margin-top:0" class="mut">File: ${esc(file.name)}. Only valid rows will be imported; rows with errors and duplicates are skipped.</p>${sum(res.length, ok.length, bad.length, dup.length)}
          <div class="imp-tbl-wrap"><table class="mini"><thead><tr><th>Row</th><th>Result</th>${cfg.columns.slice(0, 4).map(c => `<th>${esc(c.label)}</th>`).join('')}<th>Message</th></tr></thead>
          <tbody>${res.slice(0, 300).map(x => `<tr><td>${x.n}</td><td>${icon[x.st]}</td>${x.cells.map(v => `<td>${esc(v)}</td>`).join('')}<td>${esc(x.errs.join('; '))}</td></tr>`).join('')}</tbody></table></div>${res.length > 300 ? '<p class="hint">Showing the first 300 rows.</p>' : ''}`,
        buttons: [{ label: 'Cancel' }, {
          label: `Import ${ok.length} valid row(s)`, cls: 'primary', icon: 'fa-file-import', onClick: async () => {
            if (!ok.length) { toast('There are no valid rows to import.', 'error'); return false; }
            let done = 0; const failed = [];
            let bulkOk = false;
            if (cfg.bulk) { try { await cfg.bulk(ok.map(x => x.rec)); done = ok.length; bulkOk = true; } catch (e) { bulkOk = false; } }
            if (!bulkOk) for (const x of ok) { try { await cfg.insertOne(x.rec); done++; } catch (e) { failed.push({ n: x.n, m: friendly(e) }); } }
            if (cfg.done) await cfg.done();
            Audit.log('Import', cfg.entity, file.name, `${done} imported, ${bad.length + failed.length} failed, ${dup.length} duplicates`);
            Modal.open({
              title: 'Import summary', size: 'sm', escClose: true, buttons: [{ label: 'Close', cls: 'primary' }],
              html: `${sum(res.length, done, bad.length + failed.length, dup.length)}${failed.length ? `<p class="hint">Database errors: ${failed.map(f => `row ${f.n} (${esc(f.m)})`).join(', ')}</p>` : ''}`
            });
            toast(`Import finished: ${done} of ${res.length} row(s) imported.`, done ? 'success' : 'error');
          }
        }]
      });
    } catch (e) { toast(friendly(e), 'error'); }
  }
};

async function boot() {
  await loadData();

function renderCalendar(host) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth(), first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();

  for (let dd = 1; dd <= days; dd++) { if (col === 7) { html += '</tr><tr>'; col = 0; } html += `<td class="${dd === d.getDate() ? 'today' : ''}">${dd}</td>`; col++; }

function openMasterForm(entity, row) {

    if (f.type === 'number') return `<input class="inp" name="${f.k}" type="number" step="0.01" min="0" value="${esc(v ?? '')}">`;

    buttons: [{ label: 'Cancel' }, {

}
async function deleteMaster(entity, row) {
  const cfg = master(entity), label = row.name || row.emp_code || row.vendor_code || row.cost_name;
  if (cfg.noDeleteDefault) { toast('Default priority levels cannot be deleted.', 'error'); return; }
  if (cfg.noDeleteIf && cfg.noDeleteIf(row)) { toast(cfg.noDeleteTip, 'error'); return; }
  if (inUseCheck(cfg.table, row.id)) { toast('This record is used by existing tickets/vendors and cannot be deleted.', 'error'); return; }
  if (!await confirmDlg({ title: 'Delete ' + cfg.title, message: `Delete "${esc(label)}"? This cannot be undone.`, confirmLabel: 'Delete', danger: true })) return;
  try { await DB.remove(cfg.table, row.id); await loadData([cfg.table]); toast(cfg.title + ' deleted.'); Audit.log('Delete', cfg.entity, label, 'Deleted'); renderMaster(entity); }
  catch (e) { toast(e instanceof DbError && e.code === 'INUSE' ? 'This record is in use and cannot be deleted.' : friendly(e), 'error'); }
}
function importMaster(entity) {
  const cfg = master(entity);
  Importer.run({
    entity: cfg.entity, title: cfg.title, columns: cfg.importCols, existing: () => new Set(S[cfg.table].map(cfg.dupKey)), dupKey: cfg.dupKey,
    check: rec => { const errs = cfg.validate(rec); const k = Object.keys(errs); return k.length ? errs[k[0]] : null; },
    insertOne: async rec => { if (cfg.beforeSave) cfg.beforeSave(rec); await DB.insert(cfg.table, rec); },
    done: async () => { await loadData([cfg.table]); if (CURRENT_ROUTE === 'master-' + entity) renderMaster(entity); }
  });
}
