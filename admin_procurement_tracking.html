}
function renderClosedReport(host) {
  host.innerHTML = repFilterBar(`${fld('Date From', `<input class="inp" id="fFrom" type="date">`)}${fld('Date To', `<input class="inp" id="fTo" type="date">`)}${fld('Category', `<select class="sel" id="fCat">${optHtml(S.categories.map(c => ({ v: c.id, t: c.name })), '', 'All')}</select>`)}`)
    + `<div class="card" id="repRes"></div>`;
  const run = () => {
    const from = $('#fFrom').value, to = $('#fTo').value, cid = $('#fCat').value;
    let rows = S.tickets.filter(t => t.status === 'Closed' && inRange(dstr(new Date(t.closed_at || t.updated_at)), from, to));
    if (cid) rows = rows.filter(t => String(t.category_id) === cid);
    rows.sort((a, b) => new Date(b.closed_at || b.updated_at) - new Date(a.closed_at || a.updated_at));
    drawSimpleTicketTable(rows, 'closed_tickets');
  };
  $('#repApply').onclick = run; $('#repReset').onclick = () => { $('#fFrom').value = ''; $('#fTo').value = ''; $('#fCat').value = ''; run(); }; run();
}
function renderProgressReport(host) {
  host.innerHTML = repFilterBar(`${fld('Status', `<select class="sel" id="fSt"><option value="">All active</option>${S.statuses.filter(s => isActiveStatus(s.name)).map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select>`)}${fld('Priority', `<select class="sel" id="fPr">${optHtml(S.priorities.map(p => ({ v: p.id, t: p.name })), '', 'All')}</select>`)}`)
    + `<div class="card" id="repRes"></div>`;
  const run = () => {
    const st = $('#fSt').value, pid = $('#fPr').value;
    let rows = S.tickets.filter(t => isActiveStatus(t.status)); if (st) rows = rows.filter(t => t.status === st); if (pid) rows = rows.filter(t => String(t.priority_id) === pid);
    rows.sort(ticketCmp); drawSimpleTicketTable(rows, 'live_tickets');
  };
  $('#repApply').onclick = run; $('#repReset').onclick = () => { $('#fSt').value = ''; $('#fPr').value = ''; run(); }; run();
}
function drawSimpleTicketTable(rows, exportName) {
  const total = rows.reduce((s, t) => s + Number(t.cost || 0), 0);
  $('#repRes').innerHTML = `<div class="gtool"><span class="mut">${rows.length} ticket(s)</span><div class="gr">${exportBtn()}</div></div><div class="totals"><div>Total Cost<b>${money(total)}</b></div></div>
    <div class="tbl-wrap" style="max-height:420px"><table class="tbl"><thead><tr><th style="width:8%">Ticket #</th><th style="width:9%">Requestor</th><th style="width:8%">Date</th><th style="width:10%">Category</th><th style="width:10%">Vendor</th><th style="width:8%">Cost</th><th style="width:6%">Priority</th><th style="width:9%">Status</th><th>Details</th></tr></thead>
    <tbody>${rows.length ? rows.map(t => `<tr${dueAttr(t)}><td>${esc(t.ticket_no)}</td><td>${esc(requestorName(t))}</td><td>${fmtD(t.request_date)}</td><td>${esc((cat(t.category_id) || {}).name || '')}</td><td>${esc((vendor(t.vendor_id) || {}).name || '')}</td><td>${costCell(t)}</td><td class="c">${priBadge(t)}</td><td>${stBadge(t.status)}</td><td>${esc(t.details)}</td></tr>`).join('') : `<tr><td colspan="9" class="empty"><i class="fa-regular fa-folder-open"></i>No records for the selected filters.</td></tr>`}</tbody></table></div>`;
  $('[data-tool=export-menu]', $('#repRes')).parentElement.addEventListener('click', e => { const t = e.target.closest('[data-tool]'); if (!t) return; if (t.dataset.tool === 'export-menu') toggleExportMenu(t); else if (t.dataset.tool.startsWith('export-')) doExport(t.dataset.tool.split('-')[1], exportName, ['Ticket #', 'Requestor', 'Date', 'Category', 'Vendor', 'Cost', 'Priority', 'Status', 'Details'], rows.map(r => [r.ticket_no, requestorName(r), r.request_date, (cat(r.category_id) || {}).name, (vendor(r.vendor_id) || {}).name, r.cost, (pri(r.priority_id) || {}).name, r.status, r.details]), 'Report'); });
  updateOverdue();
}
function renderPeriodicReport(host) {
  host.innerHTML = repFilterBar(`${fld('Period', `<select class="sel" id="fPeriod"><option value="week">Weekly (this week)</option><option value="month">Monthly (this month)</option></select>`)}`) + `<div class="card" id="repRes"></div>`;
  const run = () => {
    const period = $('#fPeriod').value; const now = new Date(); let from, to, label;
    if (period === 'week') { [from, to] = weekRange(now); label = `Week of ${fmtD(from, true)} - ${fmtD(to, true)}`; }
    else { from = dstr(new Date(now.getFullYear(), now.getMonth(), 1)); to = dstr(new Date(now.getFullYear(), now.getMonth() + 1, 0)); label = MON[now.getMonth()] + ' ' + now.getFullYear(); }
    const rows = S.tickets.filter(t => inRange(t.request_date, from, to));
    const byStatus = {}; CORE_STATUSES.forEach(s => byStatus[s] = 0); rows.forEach(t => byStatus[t.status] = (byStatus[t.status] || 0) + 1);
    const total = rows.reduce((s, t) => s + Number(t.cost || 0), 0);
    $('#repRes').innerHTML = `<h3 style="margin-bottom:10px">${esc(label)}</h3><div class="totals"><div>Total Tickets<b>${rows.length}</b></div><div>Total Cost<b>${money(total)}</b></div></div>
      <table class="sum-tbl"><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>${CORE_STATUSES.map(s => `<tr><td>${stBadge(s)}</td><td>${byStatus[s] || 0}</td></tr>`).join('')}</tbody></table>
      <div class="gtool"><div class="gr">${exportBtn()}</div></div>`;
    $('[data-tool=export-menu]', $('#repRes')).parentElement.addEventListener('click', e => { const t = e.target.closest('[data-tool]'); if (!t) return; if (t.dataset.tool === 'export-menu') toggleExportMenu(t); else if (t.dataset.tool.startsWith('export-')) doExport(t.dataset.tool.split('-')[1], 'periodic_report_' + period, ['Ticket #', 'Requestor', 'Date', 'Category', 'Vendor', 'Cost', 'Priority', 'Status'], rows.map(r => [r.ticket_no, requestorName(r), r.request_date, (cat(r.category_id) || {}).name, (vendor(r.vendor_id) || {}).name, r.cost, (pri(r.priority_id) || {}).name, r.status]), 'Report'); });
  };
  $('#repApply').onclick = run; $('#repReset').onclick = () => { $('#fPeriod').value = 'week'; run(); }; run();
}

/* ===================== SETTINGS ===================== */
function renderSettings() {
  requireRole(ROLE.MGR); const host = $('#pageBody'); const conn = getConn(); const mode = connMode();
  host.innerHTML = `<div class="set-grid">
    <div class="card"><h3><i class="fa-solid fa-database"></i> Database Connection</h3>
      <p class="mut" style="margin-top:0">Currently running in <b>${mode === 'cloud' ? 'Cloud (Supabase)' : 'Local Demo'}</b> mode.</p>
      <form id="frmConn">
        ${fld('Mode', `<select class="sel" name="mode"><option value="auto" ${conn.mode !== 'demo' ? 'selected' : ''}>Use cloud database if configured</option><option value="demo" ${conn.mode === 'demo' ? 'selected' : ''}>Force local demo mode</option></select>`)}
        ${fld('Supabase / API URL', `<input class="inp" name="url" placeholder="https://xxxx.supabase.co" value="${esc(conn.url || '')}">`)}
        ${fld('Public anon key', `<input class="inp" name="key" placeholder="Public anon/publishable key only" value="${esc(conn.key || '')}">`, { hint: 'Never paste a service-role/secret key here.' })}
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="btnTest"><i class="fa-solid fa-plug"></i> Test Connection</button><button class="btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save &amp; Reload</button></div>
      </form><div id="connMsg" style="margin-top:10px"></div></div>
    <div class="card"><h3><i class="fa-solid fa-sliders"></i> Workflow Configuration</h3>
      <form id="frmWf">${fld('Default Priority for recurring tickets', `<select class="sel" name="rec_priority_id">${optHtml(S.priorities.map(p => ({ v: p.id, t: p.name })), setting('rec_priority_id'), null)}</select>`)}
      ${fld('Default Currency for recurring tickets', `<select class="sel" name="rec_currency_id">${optHtml(S.currencies.map(c => ({ v: c.id, t: c.name })), setting('rec_currency_id'), null)}</select>`)}
      <button class="btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save</button></form></div>
    <div class="card"><h3><i class="fa-solid fa-database"></i> Demo Data</h3><p class="mut" style="margin-top:0">Demo records are clearly marked and can be removed once you enter real master data.</p>
      <button class="btn" id="btnRemoveDemo" ${DB.hasDemo() ? '' : 'disabled'}><i class="fa-solid fa-broom"></i> Remove Demo Data</button>
      ${DB.mode === 'demo' ? '<button class="btn" id="btnResetDemo" style="margin-left:8px"><i class="fa-solid fa-rotate-left"></i> Reset Demo Data</button>' : ''}</div>
  </div>
  <div class="card"><h3><i class="fa-solid fa-users-gear"></i> User / Session Management</h3><div id="userMgmt"></div></div>`;
  $('#frmConn').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target, url = val(f, 'url').trim(), key = val(f, 'key').trim(), m = val(f, 'mode');
    if (key && isSecretKey(key)) { $('#connMsg').innerHTML = `<div class="bad-msg">This looks like a private/service-role key. Only the public anon key may be used here.</div>`; return; }
    localStorage.setItem(APP_CONFIG.CONN_KEY, JSON.stringify({ mode: m, url, key, prefix: APP_CONFIG.API_PREFIX }));
    toast('Connection settings saved. Reloading...'); Audit.log('Settings', 'Database', '', 'Connection settings updated'); setTimeout(() => location.reload(), 700);
  });
  $('#btnTest').onclick = async () => {
    $('#connMsg').innerHTML = '<span class="spin"></span> Testing...';
    const url = val($('#frmConn'), 'url').trim(), key = val($('#frmConn'), 'key').trim(), m = val($('#frmConn'), 'mode');
    try {
      let r;
      if (m !== 'demo' && url && key && !isSecretKey(key)) {
        const probe = Object.create(CloudDB); probe.cfg = () => ({ base: url.replace(/\/+$/, '') + APP_CONFIG.API_PREFIX, key });
        r = await probe.testConnection();
      } else r = await LocalDB.testConnection();
      $('#connMsg').innerHTML = `<div class="${r.ok ? 'ok-msg' : 'bad-msg'}">${esc(r.msg)}</div>`;
    } catch (e) { $('#connMsg').innerHTML = `<div class="bad-msg">${esc(friendly(e))}</div>`; }
  };
  $('#frmWf').addEventListener('submit', async e => { e.preventDefault(); const f = e.target; await saveSetting('rec_priority_id', val(f, 'rec_priority_id')); await saveSetting('rec_currency_id', val(f, 'rec_currency_id')); await loadData(['app_settings']); toast('Workflow settings saved.'); });
  $('#btnRemoveDemo').onclick = async () => { if (!await confirmDlg({ title: 'Remove Demo Data', message: 'Remove all demo-marked records (employees, vendors, categories, tickets, recurring items)? This cannot be undone.', confirmLabel: 'Remove', danger: true })) return; await DB.removeDemo(); await loadData(); toast('Demo data removed.'); renderSettings(); };
  const rd = $('#btnResetDemo'); if (rd) rd.onclick = async () => { if (!await confirmDlg({ title: 'Reset Demo Data', message: 'Reset local demo data to its original state? All current data in this browser will be lost.', confirmLabel: 'Reset', danger: true })) return; await DB.resetDemo(); await loadData(); toast('Demo data reset.'); renderSettings(); };
  renderUserMgmt();
}
function accessSummary(u) {
  if (u.role === ROLE.MGR) return '<span class="mut">All menus (Admin Manager)</span>';
  const acc = effectiveAccess(u), cands = MENU_CANDIDATES[u.role] || [];
  const on = cands.filter(c => acc.includes(c.k));
  return on.length ? on.map(c => `<span class="chip">${esc(c.label)}</span>`).join(' ') : '<span class="mut">No menu access</span>';
}
async function renderUserMgmt() {
  const host = $('#userMgmt'); host.innerHTML = '<div class="loading"><span class="spin"></span> Loading users...</div>';
  let users; try { users = await DB.listUsers(); } catch (e) { host.innerHTML = `<div class="empty">${esc(friendly(e))}</div>`; return; }
  host.innerHTML = `<div class="tbl-wrap" style="max-height:340px"><table class="tbl"><thead><tr><th style="width:11%">Username</th><th style="width:13%">Name</th><th style="width:9%">Role</th><th style="width:8%">Status</th><th style="width:10%">Last Login</th><th style="width:17%">Menu Access</th><th style="width:9%">Reset Req.</th><th style="width:23%">Actions</th></tr></thead>
    <tbody>${users.map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.name || '')}</td><td><span class="chip">${esc(u.role || '')}</span></td><td>${u.locked ? '<span class="st st-Rejected">Locked</span>' : (u.active ? '<span class="st st-Approved">Active</span>' : '<span class="st st-Draft">Disabled</span>')}</td><td>${u.last_login ? esc(fmtDT(u.last_login)) : '<span class="mut">Never</span>'}</td><td>${accessSummary(u)}</td><td>${u.reset_requested ? '<span class="st st-Pending">Yes</span>' : ''}</td><td class="act">${ib('pin', u.id, 'fa-key', 'Reset PIN')}${ib(u.active ? 'off' : 'on', u.id, u.active ? 'fa-lock' : 'fa-lock-open', u.active ? 'Disable user' : 'Enable user')}${u.role === ROLE.MGR ? '' : ib('menu', u.id, 'fa-sliders', 'Edit menu access')}</td></tr>`).join('')}</tbody></table></div>`;
  if (host.dataset.bound) return;
  host.dataset.bound = '1';
  host.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return; const id = +b.dataset.id;
    if (b.dataset.act === 'pin') {
      const pinModal = await new Promise(res => Modal.open({
        title: 'Reset PIN', size: 'sm', html: `<div class="field"><label>New 4-digit PIN <span class="req">*</span></label><input class="inp" name="npin" maxlength="4" inputmode="numeric"><div class="err" data-e="npin"></div></div>`,
        buttons: [{ label: 'Cancel', onClick: () => res(null) }, { label: 'Reset', cls: 'primary', onClick: ctx => { const p = val(ctx.el, 'npin'); if (!V.pin(p)) { showErrs(ctx.el, { npin: 'Enter exactly 4 digits.' }); return false; } res(p); } }]
      }));
      if (pinModal) { await DB.resetPin(id, pinModal); toast('PIN reset.'); Audit.log('ResetPin', 'User', id, 'PIN reset by manager'); renderUserMgmt(); }
    } else if (b.dataset.act === 'off' || b.dataset.act === 'on') {
      await DB.setUserActive(id, b.dataset.act === 'on'); toast('User ' + (b.dataset.act === 'on' ? 'enabled' : 'disabled') + '.'); Audit.log('UserStatus', 'User', id, b.dataset.act); renderUserMgmt();
    } else if (b.dataset.act === 'menu') {
      const users2 = await DB.listUsers(); const u = users2.find(x => x.id === id); if (u) openMenuAccessModal(u);
    }
  });
}
function openMenuAccessModal(u) {
  const cands = MENU_CANDIDATES[u.role] || []; const acc = effectiveAccess(u);
  Modal.open({
    title: 'Menu Access - ' + u.username, size: 'sm', escClose: false,
    html: `<p class="mut" style="margin-top:0">Choose which menus <b>${esc(u.name || u.username)}</b> (${esc(u.role)}) can access. Unchecking a menu hides it immediately for that user.</p>
      <form id="maForm">${cands.map(c => `<label class="chk"><input type="checkbox" name="m_${c.k}" ${acc.includes(c.k) ? 'checked' : ''}> ${esc(c.label)}</label>`).join('')}</form>`,
    buttons: [{ label: 'Cancel' }, {
      label: 'Save', cls: 'primary', icon: 'fa-floppy-disk', onClick: async ctx => {
        const arr = cands.filter(c => $(`[name=m_${c.k}]`, ctx.el).checked).map(c => c.k);
        try { await DB.setMenuAccess(u.id, arr); toast('Menu access updated.'); Audit.log('MenuAccess', 'User', u.username, arr.join(',') || '(none)'); renderUserMgmt(); }
        catch (e) { toast(friendly(e), 'error'); return false; }
      }
    }]
  });
}

/* ===================== STARTUP ===================== */
tryRestore();
</script>
</body>
